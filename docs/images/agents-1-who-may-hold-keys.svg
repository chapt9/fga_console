<svg xmlns="http://www.w3.org/2000/svg" width="680" height="300" viewBox="0 0 680 300" role="img">
<title>Who may ever hold a key copy, per sensitivity level</title>
<desc>People may hold key copies at every level. AI agents may at public and internal, only a reduced form at confidential, and never at restricted. Devices only send, at every level.</desc>
<style>
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.t{font-size:14px;fill:#2C2C2A}.th{font-size:14px;font-weight:500;fill:#2C2C2A}.ts{font-size:12px;fill:#5F5E5A}
.box{fill:#F1EFE8;stroke:#B4B2A9}
.c-teal>rect{fill:#E1F5EE;stroke:#0F6E56}.c-teal>.th,.c-teal>.t{fill:#085041}
.c-amber>rect{fill:#FAEEDA;stroke:#854F0B}.c-amber>.th,.c-amber>.t{fill:#633806}
.c-red>rect{fill:#FCEBEB;stroke:#A32D2D}.c-red>.th,.c-red>.t{fill:#791F1F}
</style>
<rect width="680" height="300" fill="#ffffff"/>
<text class="th" x="280" y="40" text-anchor="middle">People</text>
<text class="th" x="430" y="40" text-anchor="middle">AI agents</text>
<text class="th" x="580" y="40" text-anchor="middle">Devices</text>
<g><rect class="box" x="40" y="60" width="160" height="44" rx="8" stroke-width="0.5"/><text class="th" x="120" y="82" text-anchor="middle" dominant-baseline="central">Public</text></g>
<g><rect class="box" x="40" y="115" width="160" height="44" rx="8" stroke-width="0.5"/><text class="th" x="120" y="137" text-anchor="middle" dominant-baseline="central">Internal</text></g>
<g><rect class="box" x="40" y="170" width="160" height="44" rx="8" stroke-width="0.5"/><text class="th" x="120" y="192" text-anchor="middle" dominant-baseline="central">Confidential</text></g>
<g><rect class="box" x="40" y="225" width="160" height="44" rx="8" stroke-width="0.5"/><text class="th" x="120" y="247" text-anchor="middle" dominant-baseline="central">Restricted</text></g>
<g class="c-teal"><rect x="210" y="60" width="140" height="44" rx="8" stroke-width="0.5"/><text class="t" x="280" y="82" text-anchor="middle" dominant-baseline="central">yes</text></g>
<g class="c-teal"><rect x="210" y="115" width="140" height="44" rx="8" stroke-width="0.5"/><text class="t" x="280" y="137" text-anchor="middle" dominant-baseline="central">yes</text></g>
<g class="c-teal"><rect x="210" y="170" width="140" height="44" rx="8" stroke-width="0.5"/><text class="t" x="280" y="192" text-anchor="middle" dominant-baseline="central">yes</text></g>
<g class="c-teal"><rect x="210" y="225" width="140" height="44" rx="8" stroke-width="0.5"/><text class="t" x="280" y="247" text-anchor="middle" dominant-baseline="central">yes</text></g>
<g class="c-teal"><rect x="360" y="60" width="140" height="44" rx="8" stroke-width="0.5"/><text class="t" x="430" y="82" text-anchor="middle" dominant-baseline="central">yes</text></g>
<g class="c-teal"><rect x="360" y="115" width="140" height="44" rx="8" stroke-width="0.5"/><text class="t" x="430" y="137" text-anchor="middle" dominant-baseline="central">yes</text></g>
<g class="c-amber"><rect x="360" y="170" width="140" height="44" rx="8" stroke-width="0.5"/><text class="t" x="430" y="192" text-anchor="middle" dominant-baseline="central">reduced form</text></g>
<g class="c-red"><rect x="360" y="225" width="140" height="44" rx="8" stroke-width="0.5"/><text class="t" x="430" y="247" text-anchor="middle" dominant-baseline="central">never</text></g>
<g><rect class="box" x="510" y="60" width="140" height="44" rx="8" stroke-width="0.5"/><text class="ts" x="580" y="82" text-anchor="middle" dominant-baseline="central">send only</text></g>
<g><rect class="box" x="510" y="115" width="140" height="44" rx="8" stroke-width="0.5"/><text class="ts" x="580" y="137" text-anchor="middle" dominant-baseline="central">send only</text></g>
<g><rect class="box" x="510" y="170" width="140" height="44" rx="8" stroke-width="0.5"/><text class="ts" x="580" y="192" text-anchor="middle" dominant-baseline="central">send only</text></g>
<g><rect class="box" x="510" y="225" width="140" height="44" rx="8" stroke-width="0.5"/><text class="ts" x="580" y="247" text-anchor="middle" dominant-baseline="central">send only</text></g>
</svg>
