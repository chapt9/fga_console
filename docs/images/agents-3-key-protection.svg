<svg xmlns="http://www.w3.org/2000/svg" width="680" height="310" viewBox="0 0 680 310" role="img">
<title>Key protection on the agent's computer, by what the agent may read</title>
<desc>Not sensitive: the bridge holds the agent's own key, running as its own user. Sensitive but needed: the bridge holds no key and asks a key service on another machine, which has limits. Restricted: the agent sees only a reference and hands over to a person, who opens it in the add-on.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.th{font-size:14px;font-weight:500;fill:#2C2C2A}.ts{font-size:12px;fill:#5F5E5A}
.box{fill:#F1EFE8;stroke:#B4B2A9}
.arr{stroke:#888780;stroke-width:1.5;fill:none}
.c-teal>rect{fill:#E1F5EE;stroke:#0F6E56}.c-teal>.th{fill:#085041}.c-teal>.ts{fill:#0F6E56}
.c-amber>rect{fill:#FAEEDA;stroke:#854F0B}.c-amber>.th{fill:#633806}.c-amber>.ts{fill:#854F0B}
.c-red>rect{fill:#FCEBEB;stroke:#A32D2D}.c-red>.th{fill:#791F1F}.c-red>.ts{fill:#A32D2D}
</style>
<rect width="680" height="310" fill="#ffffff"/>
<g class="c-teal"><rect x="30" y="50" width="140" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="100" y="68" text-anchor="middle" dominant-baseline="central">Not sensitive</text>
<text class="ts" x="100" y="88" text-anchor="middle" dominant-baseline="central">public, internal</text></g>
<g class="c-amber"><rect x="30" y="140" width="140" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="100" y="158" text-anchor="middle" dominant-baseline="central">Sensitive</text>
<text class="ts" x="100" y="178" text-anchor="middle" dominant-baseline="central">but needed</text></g>
<g class="c-red"><rect x="30" y="230" width="140" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="100" y="248" text-anchor="middle" dominant-baseline="central">Restricted</text>
<text class="ts" x="100" y="268" text-anchor="middle" dominant-baseline="central">never to agents</text></g>
<g><rect class="box" x="200" y="50" width="130" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="265" y="68" text-anchor="middle" dominant-baseline="central">AI app</text>
<text class="ts" x="265" y="88" text-anchor="middle" dominant-baseline="central">reads answers</text></g>
<g><rect class="box" x="360" y="50" width="130" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="425" y="68" text-anchor="middle" dominant-baseline="central">Bridge</text>
<text class="ts" x="425" y="88" text-anchor="middle" dominant-baseline="central">own user, has key</text></g>
<g><rect class="box" x="520" y="50" width="130" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="585" y="68" text-anchor="middle" dominant-baseline="central">fga</text>
<text class="ts" x="585" y="88" text-anchor="middle" dominant-baseline="central">scrambled data</text></g>
<line x1="520" y1="78" x2="494" y2="78" class="arr" marker-end="url(#arrow)"/>
<line x1="360" y1="78" x2="334" y2="78" class="arr" marker-end="url(#arrow)"/>
<g><rect class="box" x="200" y="140" width="130" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="265" y="158" text-anchor="middle" dominant-baseline="central">AI app</text>
<text class="ts" x="265" y="178" text-anchor="middle" dominant-baseline="central">reads answers</text></g>
<g><rect class="box" x="360" y="140" width="130" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="425" y="158" text-anchor="middle" dominant-baseline="central">Bridge</text>
<text class="ts" x="425" y="178" text-anchor="middle" dominant-baseline="central">holds no key</text></g>
<g><rect class="box" x="520" y="140" width="130" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="585" y="158" text-anchor="middle" dominant-baseline="central">Key service</text>
<text class="ts" x="585" y="178" text-anchor="middle" dominant-baseline="central">other machine</text></g>
<line x1="520" y1="168" x2="494" y2="168" class="arr" marker-end="url(#arrow)"/>
<line x1="360" y1="168" x2="334" y2="168" class="arr" marker-end="url(#arrow)"/>
<g><rect class="box" x="200" y="230" width="130" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="265" y="248" text-anchor="middle" dominant-baseline="central">AI app</text>
<text class="ts" x="265" y="268" text-anchor="middle" dominant-baseline="central">gets a reference</text></g>
<g><rect class="box" x="360" y="230" width="130" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="425" y="248" text-anchor="middle" dominant-baseline="central">Hand-over</text>
<text class="ts" x="425" y="268" text-anchor="middle" dominant-baseline="central">asks a person</text></g>
<g><rect class="box" x="520" y="230" width="130" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="585" y="248" text-anchor="middle" dominant-baseline="central">Person</text>
<text class="ts" x="585" y="268" text-anchor="middle" dominant-baseline="central">opens in add-on</text></g>
<line x1="330" y1="258" x2="356" y2="258" class="arr" marker-end="url(#arrow)"/>
<line x1="490" y1="258" x2="516" y2="258" class="arr" marker-end="url(#arrow)"/>
</svg>
